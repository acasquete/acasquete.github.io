<dialog id="search" class="search" aria-label="Buscar en el blog">
  <div class="search-inner">
    <div class="search-top">
      <span class="mono">{{ site.posts.size }} notas · {{ site.posts.last.date | date: "%Y" }} a {{ site.posts.first.date | date: "%Y" }}</span>
      <button type="button" class="search-close" data-search-close aria-label="Cerrar buscador"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <label for="search-q" class="kick">Buscar</label>
    <input id="search-q" type="search" placeholder="IA, cuántica, libros, salud…" autocomplete="off">
    <div class="search-chips">
      {% for t in site.data.topics %}{% if t.filter %}<button type="button" data-search-chip="{{ t.label }}">{{ t.label }}</button>{% endif %}{% endfor %}
    </div>
    <p class="mono search-count" id="search-count" aria-live="polite">Lo más reciente</p>
    <div id="search-results"></div>
    <a href="/blog" class="search-all">Ver el archivo completo →</a>
  </div>
</dialog>
