<script src="{{ "/js/main.js" | prepend: site.baseurl | replace: '//', '/' }}?v={{ site.time | date: '%s' }}"></script>
<script src="/js/lightbox-plus-jquery.min.js"></script>
<script>
  lightbox.option({ albumLabel: "Imagen %1 de %2", sanitizeTitle: true });
  // An enlarged image is at most 75% of the viewport height.
  (function () {
    function fit() { lightbox.option({ maxHeight: Math.round(window.innerHeight * 0.75) }); }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
