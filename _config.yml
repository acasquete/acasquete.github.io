# Site settings
title: Acasquete notes
description: "Alex Casquete's Notes, things I never keep for myself"
url: "https://acasquete.github.io"
locale: es-ES
author:
  name: "Alex Casquete"
  email: "acasquete@outlook.com"
  url: "https://acasquete.github.io"

# Build settings
baseurl: / 
markdown: kramdown
source: .
destination: ./_site
permalink: /:title
paginate: 5
paginate_path: /page:num/

# Default values
defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Plugins
gems:
  - jekyll-paginate
  - jekyll-sitemap

# Custom variables
version: "1.0.0"

# Contenido pendiente: mientras esté vacío, en local se ve el marcador del diseño
# y en producción ese bloque no aparece.
bio_photo: ""
next_milestone: ""
onestep_app:
  description: ""
  url: ""
  screenshot: ""

# Enlaces del pie
github: https://github.com/acasquete
linkedin: ""
