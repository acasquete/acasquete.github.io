---
layout: default
title: Paintings
---
<section class="wrap page-head">
  <h1 class="display">Cuadros</h1>
</section>

<section class="wrap grid grid--3 paintings">
  {% for painting in site.data.paintings %}
  <a class="card" href="/paintings/{{ painting.url }}">
    <div class="img img--4-3"><img src="/img/paintings/{{ painting.image }}/{{ painting.image }}-s.jpg" alt="{{ painting.title }}" loading="lazy"></div>
    <span class="card-title"><span class="hl">{{ painting.title }}</span></span>
    <span class="card-text">Acrylic on Canvas · 19x24,8 cm</span>
  </a>
  {% endfor %}
</section>
